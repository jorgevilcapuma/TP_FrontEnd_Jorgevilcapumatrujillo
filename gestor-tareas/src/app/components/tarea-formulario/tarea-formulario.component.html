<section class="formulario">
    <h2> Nueva Tarea   </h2>
    <div class="campos">
        <input type="text" placeholder="Titulo" [(ngModel)]="tarea.titulo">
        <input type="text" placeholder="Descripcion" [(ngModel)]="tarea.descripcion">
        <select [(ngModel)] = "tarea.prioridad">
            <option value="alta"> Alta </option>
            <option value="media"> Media </option>
            <option value="baja"> Baja </option>
        </select>
        <button (click)="guardarTarea()"> Registrar Tarea </button>

    </div>
</section>
